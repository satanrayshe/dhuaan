<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Dhuaan architecture on AWS</title>
  <desc id="d">EventBridge Scheduler starts a Step Functions state machine every 3 hours that runs four Lambda steps: Ingest, Model, Advise and Notify. Ingest pulls fires from NASA FIRMS and LSA SAF Meteosat-IODC, winds and boundary-layer height from Open-Meteo, and PM2.5 from OpenAQ. The steps write artifacts to Amazon S3, which CloudFront serves to a Next.js static app on AWS Amplify Hosting. Notify sends a Telegram alert. The app calls a Lambda Function URL that runs a Strands agent on Gemini today, with Amazon Bedrock Nova as a one-parameter switch. DynamoDB holds rate limits, SSM Parameter Store holds the API keys and CloudWatch holds the dashboard and logs. HRSL population from AWS Open Data is read once at build time.</desc>
  <defs>
    <style>
      .aws  { fill: #fdf1e3; stroke: #c7781f; stroke-width: 1.5; }
      .ext  { fill: #e8f1fb; stroke: #4f86c6; stroke-width: 1.5; }
      .app  { fill: #e6f4ea; stroke: #3c8d5a; stroke-width: 1.5; }
      .dash { stroke-dasharray: 6 4; }
      .grp  { fill: none; stroke: #8c959f; stroke-width: 1.5; stroke-dasharray: 8 5; }
      .h    { fill: #1f2328; font-size: 15px; font-weight: 600; }
      .s    { fill: #4b535d; font-size: 12px; }
      .lbl  { fill: #6e7781; font-size: 12px; font-weight: 600; }
      .ln   { fill: none; stroke: #8c959f; stroke-width: 1.8; }
      .arr  { fill: none; stroke: #8c959f; stroke-width: 1.8; marker-end: url(#a); }
      .arrd { fill: none; stroke: #8c959f; stroke-width: 1.8; stroke-dasharray: 6 4; marker-end: url(#a); }
      @media (prefers-color-scheme: dark) {
        .aws { fill: #3a2a17; stroke: #e0953f; }
        .ext { fill: #172a40; stroke: #6ea2dd; }
        .app { fill: #173222; stroke: #5fb37c; }
        .h   { fill: #e6edf3; }
        .s   { fill: #b1bac4; }
        .lbl { fill: #9198a1; }
      }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/>
    </marker>
  </defs>

  <!-- external data sources -->
  <text class="lbl" x="20" y="116">EXTERNAL DATA</text>
  <rect class="ext" x="20" y="130" width="210" height="52" rx="8"/>
  <text class="h" x="34" y="152">NASA FIRMS</text><text class="s" x="34" y="170">VIIRS + MODIS fires, 375 m</text>
  <rect class="ext" x="20" y="192" width="210" height="52" rx="8"/>
  <text class="h" x="34" y="214">LSA SAF</text><text class="s" x="34" y="232">Meteosat-IODC evening FRP</text>
  <rect class="ext" x="20" y="254" width="210" height="52" rx="8"/>
  <text class="h" x="34" y="276">Open-Meteo</text><text class="s" x="34" y="294">winds 10 m/925/850 hPa, BLH</text>
  <rect class="ext" x="20" y="316" width="210" height="52" rx="8"/>
  <text class="h" x="34" y="338">OpenAQ</text><text class="s" x="34" y="356">PM2.5 stations (CPCB, SPCBs)</text>
  <rect class="ext dash" x="20" y="378" width="210" height="52" rx="8"/>
  <text class="h" x="34" y="400">HRSL population</text><text class="s" x="34" y="418">AWS Open Data, build time</text>

  <path class="ln" d="M230,156 H255 M230,218 H255 M230,280 H255 M230,342 H255 M255,156 V342"/>
  <path class="ln dash" d="M230,404 H255 V342"/>
  <path class="arr" d="M255,195 H288"/>

  <!-- scheduler -->
  <rect class="aws" x="470" y="24" width="300" height="56" rx="8"/>
  <text class="h" x="486" y="47">Amazon EventBridge Scheduler</text>
  <text class="s" x="486" y="66">every 3 h full run; 06:30 IST advise + notify</text>
  <path class="arr" d="M620,80 V118"/>

  <!-- step functions -->
  <rect class="grp" x="270" y="120" width="740" height="130" rx="12"/>
  <text class="lbl" x="286" y="142">AWS STEP FUNCTIONS · dhuaan-pipeline (retries + backoff)</text>
  <rect class="aws" x="290" y="160" width="150" height="70" rx="8"/>
  <text class="h" x="304" y="186">Ingest</text><text class="s" x="304" y="205">Lambda · 1 GB</text><text class="s" x="304" y="220">fires, met, PM2.5</text>
  <rect class="aws" x="470" y="160" width="150" height="70" rx="8"/>
  <text class="h" x="484" y="186">Model</text><text class="s" x="484" y="205">Lambda · 3 GB · numpy</text><text class="s" x="484" y="220">5-member ensemble</text>
  <rect class="aws" x="650" y="160" width="150" height="70" rx="8"/>
  <text class="h" x="664" y="186">Advise</text><text class="s" x="664" y="205">Lambda · rules</text><text class="s" x="664" y="220">EN / HI / PA notices</text>
  <rect class="aws" x="830" y="160" width="150" height="70" rx="8"/>
  <text class="h" x="844" y="186">Notify</text><text class="s" x="844" y="205">Lambda · 256 MB</text><text class="s" x="844" y="220">optional step</text>
  <path class="arr" d="M440,195 H468 M620,195 H648 M800,195 H828"/>

  <rect class="ext" x="1040" y="165" width="140" height="60" rx="8"/>
  <text class="h" x="1054" y="190">Telegram</text><text class="s" x="1054" y="209">school alert</text>
  <path class="arr" d="M980,195 H1038"/>

  <!-- artifacts bus -->
  <path class="ln" d="M365,230 V272 M545,230 V272 M725,230 V272 M365,272 H725"/>
  <path class="arr" d="M405,272 V298"/>
  <text class="lbl" x="560" y="290">writes JSON artifacts</text>

  <!-- storage + web -->
  <rect class="aws" x="290" y="300" width="230" height="64" rx="8"/>
  <text class="h" x="304" y="325">Amazon S3</text><text class="s" x="304" y="345">latest/ · runs/ · advisories/</text>
  <rect class="aws" x="600" y="300" width="200" height="64" rx="8"/>
  <text class="h" x="614" y="325">Amazon CloudFront</text><text class="s" x="614" y="345">OAC, gzip, 5 min cache</text>
  <rect class="app" x="880" y="300" width="300" height="64" rx="8"/>
  <text class="h" x="894" y="325">Next.js static app</text><text class="s" x="894" y="345">on AWS Amplify Hosting · browser</text>
  <path class="arr" d="M520,332 H598"/>
  <path class="arr" d="M800,332 H878"/>
  <text class="lbl" x="806" y="322">HTTPS</text>

  <!-- api row -->
  <path class="arr" d="M1030,364 V438"/>
  <text class="lbl" x="1040" y="406">POST /api/ask</text>
  <rect class="aws" x="880" y="440" width="300" height="80" rx="8"/>
  <text class="h" x="894" y="468">AWS Lambda Function URL</text><text class="s" x="894" y="488">/api/ask · search · advisory · health</text><text class="s" x="894" y="506">60 s, no API Gateway</text>
  <rect class="app" x="600" y="440" width="200" height="80" rx="8"/>
  <text class="h" x="614" y="468">Strands agent</text><text class="s" x="614" y="488">7 read-only tools</text><text class="s" x="614" y="506">number grounding check</text>
  <path class="arr" d="M880,480 H802"/>
  <path class="arrd" d="M650,440 L470,366"/>
  <text class="lbl" x="560" y="416">tools read latest/</text>

  <rect class="ext" x="290" y="430" width="230" height="50" rx="8"/>
  <text class="h" x="304" y="452">Gemini API</text><text class="s" x="304" y="469">runtime model today</text>
  <rect class="aws dash" x="290" y="490" width="230" height="50" rx="8"/>
  <text class="h" x="304" y="512">Amazon Bedrock · Nova</text><text class="s" x="304" y="529">ready: ModelProvider=bedrock</text>
  <path class="arr" d="M600,466 L522,456"/>
  <path class="arrd" d="M600,496 L522,514"/>

  <rect class="aws" x="880" y="560" width="300" height="56" rx="8"/>
  <text class="h" x="894" y="583">Amazon DynamoDB</text><text class="s" x="894" y="602">rate limits · subscriptions · run index</text>
  <path class="arr" d="M1030,520 V558"/>

  <!-- ops -->
  <rect class="aws" x="290" y="570" width="230" height="56" rx="8"/>
  <text class="h" x="304" y="593">SSM Parameter Store</text><text class="s" x="304" y="612">/dhuaan/* API keys, SecureString</text>
  <rect class="aws" x="600" y="570" width="200" height="56" rx="8"/>
  <text class="h" x="614" y="593">Amazon CloudWatch</text><text class="s" x="614" y="612">dhuaan-ops dashboard, logs</text>
  <text class="lbl" x="290" y="648">Every Lambda reads its keys from SSM at cold start and logs to CloudWatch. One SAM template deploys all of it (ap-south-1).</text>

  <!-- legend -->
  <rect class="aws" x="290" y="672" width="18" height="14" rx="3"/><text class="lbl" x="314" y="684">AWS service</text>
  <rect class="ext" x="420" y="672" width="18" height="14" rx="3"/><text class="lbl" x="444" y="684">external service</text>
  <rect class="app" x="580" y="672" width="18" height="14" rx="3"/><text class="lbl" x="604" y="684">Dhuaan code</text>
  <path class="ln dash" d="M720,679 H756"/><text class="lbl" x="764" y="684">build time, read path or not yet active</text>
</svg>
