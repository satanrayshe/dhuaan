[project]
name = "dhuaan"
version = "0.1.0"
description = "Dhuaan: stubble-smoke forecast, attribution and advisories for North India"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  "requests>=2.32",
  "h5py>=3.11",
  "boto3>=1.35",
  "python-dotenv>=1.0",
  "strands-agents[gemini]>=1.50",
]

[dependency-groups]
dev = ["pytest>=8", "rasterio>=1.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dhuaan"]
